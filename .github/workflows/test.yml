name: NexaBot Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4
              - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run command engine tests
        run: npm test
